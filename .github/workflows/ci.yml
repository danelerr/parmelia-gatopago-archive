name: CI

on:
  push:
    branches: [main, feature/v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Independent ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [apps/web, gatopago-wallet-core, gatopago-flow, contracts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        if: matrix.project == 'gatopago-wallet-core' || matrix.project == 'contracts'
        with:
          version: v1.7.1
      # No root dependency install or other project's build, migration, source,
      # contracts output or environment file enters this isolated verification.
      - name: Verify only this project outside the checkout
        run: pnpm --config.verify-deps-before-run=false check:standalone --project ${{ matrix.project }}
      - name: Check repository boundaries (read only, no root dependencies)
        run: node --test scripts/project-independence.test.mjs
      - name: Reject generated changes to the checkout
        run: git diff --exit-code
